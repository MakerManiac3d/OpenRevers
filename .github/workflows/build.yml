# SPDX-License-Identifier: GPL-3.0-or-later
# Build and test OpenRevers on Linux and Windows; on Windows also build the
# installer. A tag v* publishes the installer as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-qpa-plugins libgl1-mesa-dev libgl1-mesa-dri libeigen3-dev nlohmann-json3-dev libgtest-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Translations complete
        run: python3 tools/translate_es.py && git diff --exit-code -- translations/
      - name: End to end (the app driven through MCP)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 tests/e2e_mcp.py --app build/src/app/OpenRevers --cli build/src/openrevers-cli

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install into a staging folder
        run: cmake --install build --config Release
      - name: What was installed
        shell: bash
        run: ls stage/bin | head -60
      - name: End to end (the installed app driven through MCP)
        env:
          QT_OPENGL: software
        run: python tests/e2e_mcp.py --app stage/bin/OpenRevers.exe --cli stage/bin/openrevers-cli.exe --picture view.png
      - name: Installer
        working-directory: build
        run: cpack -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: OpenRevers-Windows
          path: |
            build/OpenRevers-*.exe
            build/OpenRevers-*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-view-windows
          path: view.png
          if-no-files-found: ignore
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OpenRevers ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" build/OpenRevers-*.exe build/OpenRevers-*.zip --clobber
