# SPDX-License-Identifier: GPL-3.0-or-later
# Build and test OpenRevers on Linux and Windows; on Windows also build the
# installer. A tag v* publishes the installer as a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        # The runner's Ubuntu mirror sometimes stalls or fails: each attempt
        # is limited and retried, and after the first failure the main Ubuntu
        # archive is used instead of the runner's mirror.
        timeout-minutes: 25
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Use-Pty=0"
          PKGS="ninja-build qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-qpa-plugins libgl1-mesa-dev libgl1-mesa-dri libeigen3-dev nlohmann-json3-dev libgtest-dev xvfb libocct-foundation-dev libocct-modeling-data-dev libocct-modeling-algorithms-dev libocct-data-exchange-dev libtbb-dev"
          for attempt in 1 2 3; do
            if timeout 420 sudo apt-get $APT update && timeout 420 sudo apt-get $APT install -y $PKGS; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; switching to archive.ubuntu.com and retrying"
            sudo sed -i -E 's#https?://[a-z0-9.-]*(azure|mirror)[a-z0-9.-]*/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            sleep 15
          done
          exit 1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORV_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Translations complete
        run: python3 tools/translate_es.py && git diff --exit-code -- translations/
      - name: End to end (the app driven through MCP)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python3 tests/e2e_mcp.py --app build/src/app/OpenRevers --cli build/src/openrevers-cli

  windows:
    runs-on: windows-latest
    # The first run also builds Open CASCADE (about an hour); later runs take it from the cache.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true
      - name: Open CASCADE from the cache
        id: occt
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/occt
          key: occt-7.9.3-minimal-v1-${{ runner.os }}
      - name: Build Open CASCADE 7.9.3 (only the modelling and STEP toolkits; first run only)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch V7_9_3 https://github.com/Open-Cascade-SAS/OCCT.git occt-src
          cmake -S occt-src -B occt-build -A x64 -DBUILD_LIBRARY_TYPE=Shared -DINSTALL_DIR="${{ github.workspace }}/occt" `
            -DBUILD_MODULE_FoundationClasses=OFF -DBUILD_MODULE_ModelingData=OFF -DBUILD_MODULE_ModelingAlgorithms=OFF `
            -DBUILD_MODULE_Visualization=OFF -DBUILD_MODULE_ApplicationFramework=OFF -DBUILD_MODULE_DataExchange=OFF `
            -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_DETools=OFF `
            "-DBUILD_ADDITIONAL_TOOLKITS=TKDESTEP;TKBool;TKFillet;TKOffset;TKFeat;TKMesh;TKPrim;TKBO;TKShHealing" `
            -DUSE_FREETYPE=OFF -DUSE_TK=OFF -DUSE_OPENGL=OFF -DUSE_GLES2=OFF -DUSE_D3D=OFF -DUSE_VTK=OFF -DUSE_RAPIDJSON=OFF `
            -DUSE_DRACO=OFF -DUSE_TBB=OFF -DUSE_FREEIMAGE=OFF -DUSE_FFMPEG=OFF -DUSE_OPENVR=OFF -DBUILD_DOC_Overview=OFF
          cmake --build occt-build --config Release --parallel
          cmake --install occt-build --config Release
      - name: Keep the Open CASCADE build (saved now, even if a later step fails)
        if: steps.occt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/occt
          key: occt-7.9.3-minimal-v1-${{ runner.os }}
      - name: Open CASCADE on the path
        run: echo "${{ github.workspace }}\occt\win64\vc14\bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" -DOpenCASCADE_DIR="${{ github.workspace }}/occt/cmake"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install into a staging folder
        run: cmake --install build --config Release
      - name: End to end (the installed app driven through MCP)
        env:
          QT_OPENGL: software
        run: python tests/e2e_mcp.py --app stage/bin/OpenRevers.exe --cli stage/bin/openrevers-cli.exe --picture view.png
      - name: NSIS, for the installer
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Installer
        working-directory: build
        run: cpack -C Release
      - uses: actions/upload-artifact@v7
        with:
          name: OpenRevers-Windows
          path: |
            build/OpenRevers-*.exe
            build/OpenRevers-*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-view-windows
          path: view.png
          if-no-files-found: ignore
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "OpenRevers ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" build/OpenRevers-*.exe build/OpenRevers-*.zip --clobber
